name: "openclaw-{{TENANT_ID}}"

services:
  openclaw:
    image: "{{IMAGE}}"
    container_name: "openclaw-{{TENANT_ID}}"
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Real headful Chromium on a virtual display — full rendering, not
      # headless. Xvfb is started by the command below; the browser attaches
      # to DISPLAY. NO_SANDBOX because cap_drop:ALL removes what Chrome's own
      # sandbox needs (the container is the isolation boundary).
      - DISPLAY=:99
      - OPENCLAW_BROWSER_HEADLESS=false
      - OPENCLAW_BROWSER_NO_SANDBOX=true
      # Expose the browser tool to the agent (otherwise it only has web_fetch).
      - OPENCLAW_BROWSER_ENABLED=true
      # Chrome's own sandbox needs unprivileged userns, which cap_drop:ALL +
      # no-new-privileges block — so launch via a wrapper that always adds
      # --no-sandbox. The container is the isolation boundary. (The NO_SANDBOX
      # env above isn't honored by the CDP profile launch; the wrapper is.)
      - OPENCLAW_BROWSER_EXECUTABLE_PATH=/opt/ms-playwright/chrome-nosandbox.sh
      # Chromium comes from one shared read-only copy (see volumes) instead of a
      # ~1GB per-tenant install — this is what makes dozens of tenants fit on
      # one host's disk. Falls back to ./browser-cache if the shared dir is absent.
      - PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
      # Call-home telemetry (openclaw-telemetry on npm). The access token
      # comes from the tenant's .env (OPENCLAW_TELEMETRY_TOKEN, written by
      # the control plane); with no token the reporter simply never starts.
      - OPENCLAW_TELEMETRY_URL=https://8examples.com/openclaw/telemetry
      - OPENCLAW_TELEMETRY_CLAW={{TENANT_ID}}
    # Start Xvfb, then hand off to the image's real command (node openclaw.mjs
    # gateway). Entrypoint stays tini via init:true.
    command:
      - /bin/bash
      - -lc
      - "Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & if [ -n \"$$OPENCLAW_TELEMETRY_TOKEN\" ]; then (npx -y openclaw-telemetry run >/tmp/telemetry.log 2>&1 &); fi; exec node openclaw.mjs gateway"
    ports:
      # Gateway is only reachable from the host; front it with your reverse proxy.
      - "127.0.0.1:{{PORT}}:18789"
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
      # Local encryption key for OAuth auth-profile tokens. Must live OUTSIDE
      # the .openclaw mount — do not nest this under ./config. Losing it
      # invalidates every stored OAuth credential for this tenant.
      - ./auth-profile-secrets:/home/node/.config/openclaw
      # Chrome's writable runtime profile/cache (small).
      - ./browser-cache:/home/node/.cache
      # One shared read-only Chromium for the whole fleet (see PLAYWRIGHT_BROWSERS_PATH).
      - ../../shared/ms-playwright:/opt/ms-playwright:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: "{{MEM_LIMIT}}"
    memswap_limit: "{{MEM_LIMIT}}" # no swap escape hatch — fail fast, don't thrash the host
    cpus: "{{CPUS}}"
    pids_limit: {{PIDS_LIMIT}}
    shm_size: 1g # Chrome dies on Docker's 64m default
