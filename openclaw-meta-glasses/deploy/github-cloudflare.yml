name: Configure OpenClaw glasses Cloudflare route

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-openclaw-fleet-tunnel
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add glasses route and DNS while preserving existing services
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN }}
          CF_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import copy, json, os, time, urllib.error, urllib.request

          api = 'https://api.cloudflare.com/client/v4'
          account = 'be2484925dc7150169c09e6770fb7e38'
          tunnel = 'a96d6a4a-940c-47e2-bd82-479bbfc07884'
          hostname = 'glasses.fusenv.com'
          origin = 'http://127.0.0.1:8795'
          dns_token = os.environ['CF_DNS_TOKEN']
          tunnel_token = os.environ['CF_TUNNEL_TOKEN']
          assert dns_token and tunnel_token, 'Cloudflare secrets are required'

          def request(path, token, method='GET', body=None):
              req = urllib.request.Request(api + path, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                  data=None if body is None else json.dumps(body).encode())
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              assert result.get('success'), 'Cloudflare request failed'
              return result['result']

          zones = request('/zones?name=fusenv.com', dns_token)
          assert len(zones) == 1 and zones[0]['account']['id'] == account, 'Unexpected zone/account'
          records_path = '/zones/' + zones[0]['id'] + '/dns_records'
          records = request(records_path + '?name=' + hostname, dns_token)
          desired_dns = {'type': 'CNAME', 'name': hostname,
              'content': tunnel + '.cfargotunnel.com', 'proxied': True, 'ttl': 1}
          assert len(records) <= 1, 'Multiple existing DNS records need review'
          if records:
              assert all(records[0].get(k) == desired_dns[k] for k in ('type', 'content', 'proxied')), 'Existing DNS record points elsewhere'

          config_path = '/accounts/' + account + '/cfd_tunnel/' + tunnel + '/configurations'
          before = request(config_path, tunnel_token)
          config = copy.deepcopy(before['config'])
          rules = config['ingress']
          assert rules and not rules[-1].get('hostname'), 'Missing final catch-all rule'
          matches = [r for r in rules if r.get('hostname') == hostname]
          assert len(matches) <= 1, 'Duplicate glasses routes need review'
          if matches:
              assert matches[0].get('service') == origin and not matches[0].get('path'), 'Existing route points elsewhere'
          else:
              # Insert first so an existing wildcard cannot shadow this exact hostname.
              rules.insert(0, {'hostname': hostname, 'service': origin})
          assert [r for r in rules if r.get('hostname') != hostname] == [r for r in before['config']['ingress'] if r.get('hostname') != hostname]
          if config != before['config']:
              current = request(config_path, tunnel_token)
              assert current['config'] == before['config'] and current.get('version') == before.get('version'), 'Tunnel changed concurrently; rerun'
              request(config_path, tunnel_token, 'PUT', {'config': config})
          verified = request(config_path, tunnel_token)
          assert verified['config'] == config, 'Tunnel configuration verification failed'
          if not records:
              request(records_path, dns_token, 'POST', desired_dns)
          records = request(records_path + '?name=' + hostname, dns_token)
          assert len(records) == 1 and all(records[0].get(k) == desired_dns[k] for k in ('type', 'content', 'proxied')), 'DNS verification failed'
          print('Configured https://' + hostname + ' -> ' + origin + '; existing tunnel rules preserved', flush=True)

          def public_request(path):
              # Identify this legitimate API probe; the zone rejects Python's default user-agent.
              req = urllib.request.Request('https://' + hostname + path,
                  headers={'User-Agent': 'OpenClaw-Glasses-Deployment/1.0'})
              return urllib.request.urlopen(req, timeout=10)

          for attempt in range(30):
              try:
                  with public_request('/health') as response:
                      assert response.status == 200 and json.load(response) == {'ok': True}
                  break
              except Exception as error:
                  print('Health probe retry:', type(error).__name__, getattr(error, 'code', ''), flush=True)
                  if attempt == 29:
                      raise RuntimeError('Public HTTPS health check did not pass') from None
                  time.sleep(5)
          try:
              public_request('/v1/me')
          except urllib.error.HTTPError as error:
              assert error.code == 401, 'Expected authentication rejection'
          else:
              raise RuntimeError('Unauthenticated access was not rejected')
          print('Public HTTPS health and authentication checks passed')
          PY
