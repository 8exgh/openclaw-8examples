name: Deploy OpenClaw glasses backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-openclaw-fleet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, openclaw-dc]
    timeout-minutes: 15
    steps:
      - name: Update the glasses backend and install daily backups
        run: |
          set -euo pipefail
          cd /home/openclaw/managed-openclaw
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          bash openclaw-meta-glasses/deploy/deploy.sh
      - name: Verify public HTTPS and authentication
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://glasses.fusenv.com/health | jq -e '.ok == true'
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://glasses.fusenv.com/v1/me)
          test "$code" = 401
